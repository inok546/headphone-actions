# SPDX-License-Identifier: AGPL-3.0-only
#
# Runs the automated checks on every push and pull request to main, before any hardware test.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The project compiles for Java 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Validates the Gradle Wrapper and caches Gradle state. The "basic" provider is the fully
      # open-source (MIT) cache implementation.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # No Android SDK setup step: the runner image's preinstalled SDK (ANDROID_HOME) already has
      # platforms;android-37.0 and build-tools;36.0.0. Add an sdkmanager step if an image drops them.
      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
